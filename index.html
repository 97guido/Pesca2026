<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestione Premi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-dvh flex flex-col justify-between">

    <!-- CONTENUTO PRINCIPALE SCORREVOLE -->
    <main class="flex-1 p-4 pb-24 overflow-y-auto w-full max-w-md mx-auto">
        
        <!-- MODALITÀ 1: RICERCA PER NUMERO -->
        <div id="view-ricerca" class="space-y-4 pt-1">
            
            <!-- Campo Input in Alto con Tasto "X" -->
            <div class="w-full">
                <label for="search-input" class="block text-center text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">
                    Inserisci Numero
                </label>
                <div class="relative flex items-center">
                    <input 
                        type="number" 
                        id="search-input" 
                        inputmode="numeric" 
                        pattern="[0-9]*"
                        placeholder="Es. 26" 
                        class="w-full py-3 pl-10 pr-10 text-center text-2xl font-extrabold border border-gray-300 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-white"
                    >
                    <!-- Tasto 'X' per cancellare -->
                    <button 
                        id="clear-btn" 
                        type="button" 
                        class="hidden absolute right-3 p-1.5 text-gray-400 hover:text-gray-600 focus:outline-none bg-gray-100 rounded-full"
                        aria-label="Cancella numero"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Box Risultato Posizionato Subito Sotto l'Input -->
            <div class="w-full">
                <div id="result-box" class="w-full p-5 bg-white rounded-2xl border border-gray-100 shadow-sm transition-all duration-300 transform scale-95 opacity-0 min-h-[140px] flex flex-col justify-center items-center text-center">
                    <div id="result-title" class="text-2xl font-black text-blue-600 leading-tight"></div>
                    <div id="result-details" class="text-xs font-medium text-gray-500 mt-2 space-y-1"></div>
                </div>
            </div>

        </div>

        <!-- MODALITÀ 2: FILTRO SCATOLA -->
        <div id="view-scatola" class="hidden space-y-3 pt-1">
            <label for="scatola-select" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">
                Seleziona Scatola
            </label>
            <div class="relative mb-4">
                <select 
                    id="scatola-select" 
                    class="w-full p-3 bg-white border border-gray-300 rounded-xl shadow-sm text-base font-semibold text-gray-800 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                    <!-- Opzioni popolate dinamicamente -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                    <svg class="fill-current h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                </div>
            </div>

            <!-- Lista Premi Filtrati -->
            <div id="premi-list" class="space-y-2.5">
                <!-- Voci popolate dinamicamente -->
            </div>
        </div>

    </main>

    <!-- BARRA DI NAVIGAZIONE IN BASSO -->
    <nav class="fixed bottom-0 left-0 right-0 h-16 bg-white border-t border-gray-200 flex items-center justify-around z-50 px-6 shadow-md">
        <button id="nav-ricerca" class="flex flex-col items-center justify-center w-24 h-full text-blue-600 transition-colors">
            <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span class="text-[11px] font-bold tracking-wide">Cerca Numero</span>
        </button>

        <button id="nav-scatola" class="flex flex-col items-center justify-center w-24 h-full text-gray-400 transition-colors">
            <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
            <span class="text-[11px] font-bold tracking-wide">Scatole</span>
        </button>
    </nav>

    <script>
        // DATI JSON
        const datiPremi = [
            {
                "_id": { "$oid": "6aad1c2912017f792cd0789a" },
                "premio": "Firme",
                "quantita": 25,
                "scatola": "Non assegnata",
                "da": 1,
                "a": 25
            },
            {
                "_id": { "$oid": "6aad1c2912017f792cd0789b" },
                "premio": "Puzzle Paesaggi",
                "quantita": 2,
                "scatola": "A vista",
                "da": 26,
                "a": 27
            }
        ];

        // RIFERIMENTI DOM
        const viewRicerca = document.getElementById('view-ricerca');
        const viewScatola = document.getElementById('view-scatola');
        const navRicerca = document.getElementById('nav-ricerca');
        const navScatola = document.getElementById('nav-scatola');
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-btn');
        const resultBox = document.getElementById('result-box');
        const resultTitle = document.getElementById('result-title');
        const resultDetails = document.getElementById('result-details');
        const scatolaSelect = document.getElementById('scatola-select');
        const premiList = document.getElementById('premi-list');

        // GESTIONE CAMBIO MODALITÀ
        navRicerca.addEventListener('click', () => switchView('ricerca'));
        navScatola.addEventListener('click', () => switchView('scatola'));

        function switchView(view) {
            if (view === 'ricerca') {
                viewRicerca.classList.remove('hidden');
                viewScatola.classList.add('hidden');
                navRicerca.classList.replace('text-gray-400', 'text-blue-600');
                navScatola.classList.replace('text-blue-600', 'text-gray-400');
                setTimeout(() => searchInput.focus(), 50);
            } else {
                viewScatola.classList.remove('hidden');
                viewRicerca.classList.add('hidden');
                navScatola.classList.replace('text-gray-400', 'text-blue-600');
                navRicerca.classList.replace('text-blue-600', 'text-gray-400');
            }
        }

        // GESTIONE RICERCA E TASTO CLEAR
        searchInput.addEventListener('input', () => {
            const valore = searchInput.value.trim();
            
            // Gestione visibilità tasto "X"
            if (valore !== '') {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
                nascondiRisultato();
                return;
            }

            const numero = parseInt(valore, 10);
            if (isNaN(numero)) {
                mostraRisultato("Numero non valido", "Inserisci un valore numerico corretto", "text-red-500", "bg-red-50");
                return;
            }

            const trovato = datiPremi.find(item => numero >= item.da && numero <= item.a);

            if (trovato) {
                const scatolaTesto = trovato.scatola ? trovato.scatola : "Non specificata";
                const dettagliHtml = `
                    <div class="text-sm">Scatola: <span class="font-bold text-gray-800">${scatolaTesto}</span></div>
                    <div class="text-sm">Quantità: <span class="font-bold text-gray-800">${trovato.quantita}</span></div>
                    <div class="text-[11px] text-gray-400 pt-1">Intervallo valido: ${trovato.da} - ${trovato.a}</div>
                `;
                mostraRisultato(trovato.premio, dettagliHtml, "text-blue-600", "bg-white");
            } else {
                mostraRisultato("Nessun premio", `Nessun elemento associato al numero ${numero}`, "text-gray-400", "bg-gray-100");
            }
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            nascondiRisultato();
            searchInput.focus();
        });

        function mostraRisultato(titolo, dettagli, classeTesto, classeSfondo) {
            resultBox.className = `w-full p-5 rounded-2xl border border-gray-100 shadow-sm transition-all duration-300 transform scale-100 opacity-100 min-h-[140px] flex flex-col justify-center items-center ${classeSfondo}`;
            resultTitle.innerHTML = titolo;
            resultTitle.className = `text-2xl font-black leading-tight ${classeTesto}`;
            resultDetails.innerHTML = dettagli;
        }

        function nascondiRisultato() {
            resultBox.classList.add('opacity-0', 'scale-95');
            resultBox.classList.remove('opacity-100', 'scale-100');
            setTimeout(() => {
                if(searchInput.value.trim() === '') {
                    resultTitle.innerHTML = '';
                    resultDetails.innerHTML = '';
                }
            }, 300);
        }

        // LOGICA FILTRO PER SCATOLA
        function inizializzaFiltroScatola() {
            const scatoleUniche = [...new Set(datiPremi.map(item => item.scatola || "Non specificata"))].sort();
            
            scatolaSelect.innerHTML = '';
            
            scatoleUniche.forEach(scatola => {
                const opzione = document.createElement('option');
                opzione.value = scatola;
                opzione.textContent = scatola;
                scatolaSelect.appendChild(opzione);
            });

            if (scatoleUniche.length > 0) {
                aggiornaListaPremi(scatoleUniche[0]);
            }

            scatolaSelect.addEventListener('change', (e) => {
                aggiornaListaPremi(e.target.value);
            });
        }

        function aggiornaListaPremi(nomeScatola) {
            premiList.innerHTML = '';
            const filtrati = datiPremi.filter(item => (item.scatola || "Non specificata") === nomeScatola);

            if (filtrati.length === 0) {
                premiList.innerHTML = '<div class="text-center text-gray-400 py-6 text-sm">Nessun premio in questa scatola</div>';
                return;
            }

            filtrati.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center";
                card.innerHTML = `
                    <div class="flex-1 pr-2">
                        <h4 class="font-bold text-gray-800 text-sm leading-tight mb-1">${item.premio}</h4>
                        <div class="text-[11px] font-semibold text-blue-500 uppercase tracking-wide">
                            Da ${item.da} a ${item.a}
                        </div>
                    </div>
                    <div class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg text-center min-w-[48px]">
                        <span class="block text-[9px] font-bold uppercase tracking-tighter text-blue-400">Qtà</span>
                        <span class="text-sm font-black leading-none">${item.quantita}</span>
                    </div>
                `;
                premiList.appendChild(card);
            });
        }

        // AVVIO
        window.addEventListener('DOMContentLoaded', () => {
            inizializzaFiltroScatola();
            searchInput.focus();
        });
    </script>
</body>
</html>
